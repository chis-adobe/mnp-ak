name = "office-schema-poc"
main = "src/index.js"
compatibility_date = "2024-09-23"

# POC only — no routes/zones bound. Run locally with `npm run dev`.

[vars]
# Where the real page HTML is fetched from (the AEM origin).
ORIGIN = "https://main--mnp-ak--chis-adobe.aem.live"
# Public origin the schema's canonical/@id URLs point to (this site's own domain).
SITE_ORIGIN = "https://main--mnp-ak--chis-adobe.aem.live"

# SUPABASE_URL / SUPABASE_KEY come from .dev.vars locally,
# or `wrangler secret put` for a deployed worker.
